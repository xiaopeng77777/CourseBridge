name: 问题反馈
description: 报告连接、界面或页面适配问题
body:
  - type: markdown
    attributes:
      value: 请勿提交 API Key、配对码、二维码、姓名学号、完整课程网址、真实试卷或浏览器资料。
  - type: input
    id: version
    attributes:
      label: 课桥版本与 Windows 版本
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: 页面类型或去除问号及参数后的路径
  - type: textarea
    id: steps
    attributes:
      label: 如何复现、实际结果和预期结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏的错误提示或截图
