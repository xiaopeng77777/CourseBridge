name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run audit:release
      - name: Inspect Electron runtime
        run: |
          node -e "const fs=require('fs'),cp=require('child_process');const exe=require('electron');console.log({exe,size:fs.statSync(exe).size,signature:fs.readFileSync(exe).subarray(0,2).toString()});const r=cp.spawnSync(exe,['--version'],{encoding:'utf8',timeout:15000,windowsHide:true});console.log({status:r.status,error:r.error?.message,stdout:r.stdout,stderr:r.stderr});"
      - run: npm run test:desktop
        env:
          DEBUG: pw:browser*
