<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课桥</title><link rel="stylesheet" href="popup.css"></head><body>
<div class="eyebrow">COURSEBRIDGE / 0.1.23</div><h1>课桥<span>浏览器连接器</span></h1><p>让课程页面与桌面端保持连接。</p>
<label for="token">桌面端配对码</label><input id="token" type="password" placeholder="从课桥桌面端复制" autocomplete="off"><button id="pair">保存并连接</button><div id="status" role="status">尚未配对</div>
<div class="actions"><button id="start" class="secondary">开始任务</button><button id="pause" class="secondary">暂停任务</button></div>
<small>仅连接这台电脑。配对后刷新课程页面。</small><script src="popup.js"></script></body></html>
